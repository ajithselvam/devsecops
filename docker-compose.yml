services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_WS_URL: ws://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-characters}
      AI_OMNIROUTE_URL: ${AI_OMNIROUTE_URL:-http://host.docker.internal:20128/v1}
      AI_OMNIROUTE_KEY: ${AI_OMNIROUTE_KEY:-omniroute}
      AI_OMNIROUTE_MODEL: ${AI_OMNIROUTE_MODEL:-auto}
      AI_APPS_SCRIPT_URL: ${AI_APPS_SCRIPT_URL:-}
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  app-data:
