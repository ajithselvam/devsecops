# The master stays root so it can bind :80 and write the temp paths under
# /var/lib/nginx/tmp; the workers drop to the unprivileged nginx user.
user nginx;
worker_processes auto;

# Logs go to the container stdout/stderr so `kubectl logs` and `docker logs`
# show both nginx and the API, and the image needs no writable log dir.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Matches MAX_FILE_SIZE (25MB) on the API so large uploads are rejected by
  # the API rather than truncated by the proxy.
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/wasm;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA and the API share this origin, so the browser makes same-origin
    # requests and CORS is not involved. These proxy rules exist to hand the
    # two API surfaces to the node process in the same container.
    location /api/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # AI scan/fix calls routed through OmniRoute can run for minutes,
      # well past nginx's 60s default.
      proxy_connect_timeout 75s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_buffering off;
    }

    # Job progress notifications. The long read timeout keeps the connection
    # open for the whole scan.
    location /ws {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    location /health {
      proxy_pass http://127.0.0.1:3001/health;
      proxy_set_header Host $host;
    }

    # Rewritten at container start from the environment, so it must never be
    # served from the browser cache or a rolled-out pod keeps old settings.
    location = /runtime-config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      expires -1;
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # index.html must stay uncached: it is what points at the current bundle.
    location / {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
